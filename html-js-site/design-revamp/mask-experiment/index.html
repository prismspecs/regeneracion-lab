    <meta charset="UTF-8">

    <title>REGENERACIÓN LAB</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            overflow-x: hidden;
            background: #765163;
        }

        body {
            height: 600vh;
        }

        .hero {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .hero-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1) saturate(1.2) brightness(0.9);
            transform-origin: center center;
            will-change: transform;
            transition: transform 0.1s linear;
        }

        /*
         * The mask SVG sits on top of the image.
         * It's a full-viewport rectangle of the bg color (#765163)
         * with the title text punched out (revealing the image beneath).
         *
         * We use a viewBox on the inner SVG to scale the path
         * edge-to-edge, controlled via CSS width + transform for scroll.
         */
        .mask-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .title-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            /* Let the aspect ratio determine the height from the width */
            transition: none;
        }
    </style>
</head>

    <script>
        const titleSvg = document.getElementById('titleSvg');
        const titlePath = document.getElementById('titlePath');
        const bgRect = document.getElementById('bgRect');
        const maskBg = document.getElementById('maskBg');

        // The path's native viewBox dimensions
        const VB_W = 1192.10;
        const VB_H = 97.00;
        const ASPECT = VB_W / VB_H; // ~12.29

        function getScaledHeight() {
            // The SVG fills 100% width; its rendered height = width / aspect ratio
            const vw = document.documentElement.clientWidth;
            return vw / ASPECT;
        }

        function onScroll() {
            const vh = window.innerHeight;
            const scaledH = getScaledHeight();

            // Use a slight ease-out for the progress to make it feel smoother
            let rawProgress = Math.min(window.scrollY / (vh * 2.5), 1);
            // Ease out cubic
            const progress = 1 - Math.pow(1 - rawProgress, 3);

            // Move from top (y=0) toward bottom (y = vh - scaledH)
            const yOffset = progress * (vh - scaledH);
            titleSvg.setAttribute('y', yOffset);

            // subtle image scale parallax
            const imgScale = 1 + (rawProgress * 0.15);
            document.querySelector('.hero-image').style.transform = `scale(${imgScale})`;

            // Swap: mask bg white→black (bg-color disappears, image shows)
            //       mask text black→white (letters fill with bg-color)
            const bgGray = Math.round(255 * (1 - progress));
            const textGray = Math.round(255 * progress);
            maskBg.setAttribute('fill', 'rgb(' + bgGray + ',' + bgGray + ',' + bgGray + ')');
            titlePath.setAttribute('fill', 'rgb(' + textGray + ',' + textGray + ',' + textGray + ')');
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);
        onScroll();
    </script>
